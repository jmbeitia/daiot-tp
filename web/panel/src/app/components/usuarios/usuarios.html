<h2 class="page-title">Usuarios</h2>

<mat-card>
  <mat-card-content>
    <div class="toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="buscarCtrl" autocomplete="off" />
      </mat-form-field>
    </div>

    @if (cargando()) {
      <div class="spinner-wrapper"><mat-spinner diameter="40" /></div>
    } @else {
      <table mat-table [dataSource]="dataSource" matSort class="usuarios-table">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
          <td mat-cell *matCellDef="let row">
            <span [class]="'rol-badge rol-badge--' + row.rol">{{ row.rol | titlecase }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <span [class]="row.activo ? 'badge badge--activo' : 'badge badge--inactivo'">
              {{ row.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columnas;"
          class="usuario-row"
          (click)="abrirEditar(row)"
        ></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">No se encontraron usuarios.</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[25, 50, 100]" pageSize="25" showFirstLastButtons />
    }
  </mat-card-content>
</mat-card>

<button mat-fab class="fab" color="primary" aria-label="Nuevo usuario" matTooltip="Nuevo usuario" (click)="abrirNuevo()">
  <mat-icon>add</mat-icon>
</button>
