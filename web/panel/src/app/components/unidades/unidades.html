<h2 class="page-title">Unidades</h2>

<mat-card>
  <mat-card-content>
    <div class="toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="buscarCtrl" autocomplete="off" />
      </mat-form-field>
    </div>

    @if (cargando()) {
      <div class="spinner-wrapper"><mat-spinner diameter="40" /></div>
    } @else {
      <table mat-table [dataSource]="dataSource" matSort class="unidades-table">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="abreviacion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Abreviación</th>
          <td mat-cell *matCellDef="let row" class="abreviacion-cell">
            {{ row.abreviacion ?? '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef class="accion-col"></th>
          <td mat-cell *matCellDef="let row" class="accion-col">
            <button mat-icon-button (click)="abrirEditar(row)" aria-label="Editar unidad" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="eliminar(row)"
              aria-label="Eliminar unidad"
              matTooltip="Eliminar"
              [disabled]="eliminando() === row.id"
            >
              @if (eliminando() === row.id) {
                <mat-spinner diameter="18" />
              } @else {
                <mat-icon>delete</mat-icon>
              }
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">No se encontraron unidades.</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[25, 50, 100]" pageSize="25" showFirstLastButtons />
    }
  </mat-card-content>
</mat-card>

<button mat-fab class="fab" color="primary" aria-label="Nueva unidad" matTooltip="Nueva unidad" (click)="abrirNueva()">
  <mat-icon>add</mat-icon>
</button>
