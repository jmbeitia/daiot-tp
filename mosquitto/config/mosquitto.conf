# Broker propio del TP DAIoT. Único listener: TLS mutuo en 8883.
# No hay listener en texto plano ni acceso anónimo.

listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

require_certificate true
use_identity_as_username true
allow_anonymous false
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
