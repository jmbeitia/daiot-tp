<h2 class="page-title">Categorías</h2>

<mat-card>
  <mat-card-content>
    <div class="toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="buscarCtrl" autocomplete="off" />
      </mat-form-field>
    </div>

    @if (cargando()) {
      <div class="spinner-wrapper"><mat-spinner diameter="40" /></div>
    } @else {
      <table mat-table [dataSource]="dataSource" matSort class="categorias-table">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let row" class="descripcion-cell">
            {{ row.descripcion ?? '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let row">
            <button
              mat-icon-button
              class="toggle-btn"
              (click)="toggleActivo(row)"
              [matTooltip]="row.activo ? 'Desactivar' : 'Activar'"
              [attr.aria-label]="row.activo ? 'Desactivar categoría' : 'Activar categoría'"
            >
              <mat-icon [style.color]="row.activo ? 'var(--mat-sys-primary)' : 'var(--mat-sys-on-surface-variant)'"
                style="font-size:28px;width:28px;height:28px;line-height:28px;display:flex;align-items:center;justify-content:center">
                {{ row.activo ? 'toggle_on' : 'toggle_off' }}
              </mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button (click)="abrirEditar(row)" aria-label="Editar categoría">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">No se encontraron categorías.</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[25, 50, 100]" pageSize="25" showFirstLastButtons />
    }
  </mat-card-content>
</mat-card>

<button mat-fab class="fab" color="primary" aria-label="Nueva categoría" matTooltip="Nueva categoría" (click)="abrirNueva()">
  <mat-icon>add</mat-icon>
</button>
